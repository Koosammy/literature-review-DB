<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f5;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">$message</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f4f6f5" style="background-color:#f4f6f5;">
    <tr>
      <td align="center" style="padding:20px 10px;">
        <!--[if mso]><table role="presentation" width="565" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="width:100%;max-width:565px;table-layout:fixed;border:1px solid #cddad4;background-color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;color:#172b25;">
          <tr>
            <td bgcolor="#14513e" height="5" style="height:5px;line-height:5px;font-size:1px;background-color:#14513e;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:16px 22px;border-bottom:1px solid #cddad4;">
              <p style="margin:0 0 3px;font-size:11px;line-height:16px;letter-spacing:0.6px;text-transform:uppercase;font-weight:bold;color:#475b53;">University of Health and Allied Sciences</p>
              <p style="margin:0;font-size:20px;line-height:26px;font-weight:bold;color:#14513e;">UHAS Research Hub</p>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 22px 20px;">
              <h1 style="margin:0 0 15px;font-size:25px;line-height:31px;font-weight:bold;color:#172b25;">$title</h1>
              <p style="margin:0 0 12px;font-size:15px;line-height:23px;color:#172b25;">Dear $name,</p>
              <p style="margin:0 0 17px;font-size:15px;line-height:23px;color:#172b25;">$message</p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
                <tr>
                  <td bgcolor="#14513e" style="background-color:#14513e;border-radius:4px;mso-padding-alt:11px 15px;">
                    <a href="$url" style="display:inline-block;padding:11px 15px;mso-padding-alt:0;font-size:14px;line-height:20px;font-weight:bold;text-decoration:none;white-space:nowrap;color:#ffffff;"><span style="color:#ffffff;">$action</span></a>
                  </td>
                  $expiry_cell
                </tr>
              </table>
              <p style="margin:0 0 12px;font-size:13px;line-height:20px;color:#475b53;">Direct link<br><a href="$url" style="color:#14513e;text-decoration:underline;word-break:break-all;overflow-wrap:anywhere;">$url</a></p>
              <p style="margin:0;font-size:13px;line-height:20px;color:#475b53;">$note</p>
            </td>
          </tr>
          <tr>
            <td bgcolor="#f4f6f5" style="padding:10px 22px;border-top:1px solid #cddad4;background-color:#f4f6f5;font-size:13px;line-height:19px;color:#475b53;">Research Hub Administration</td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
